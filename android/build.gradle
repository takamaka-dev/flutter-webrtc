group 'com.cloudwebrtc.webrtc'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

// C182 (Takamaka): the webrtc-sdk fork with the RFC 9605 SFrame transformer, from a local file repository
// (tool/install_tkm_aar.sh). Override the directory with -PtkmWebrtcMavenRepo=<dir>.
def tkmWebrtcRepo = project.findProperty('tkmWebrtcMavenRepo') ?: "${projectDir}/local-maven"
def tkmWebrtcVersion = '150.7871.03-tkm.7' // C-24 hold + C-25 AGC2 / mic-direction

// C182 B-0 (2026-10-12): when the fork AAR is not in that repository, fetch it from the
// takamaka-dev/webrtc-build release by TAG and refuse it unless its sha256 is the pinned one —
// so another PC builds without the 23 GB WebRTC tree. Override with -PtkmWebrtcAarUrl=… and
// -PtkmWebrtcAarSha256=… (both must change together); -PtkmWebrtcAarOffline=true skips the fetch.
def tkmWebrtcAarUrl = project.findProperty('tkmWebrtcAarUrl') ?:
    'https://github.com/takamaka-dev/webrtc-build/releases/download/android-c182-sframe.2/libwebrtc-android-c182-sframe.2.aar'
def tkmWebrtcAarSha256 = project.findProperty('tkmWebrtcAarSha256') ?:
    '6d775474a99bdf65c6d0198c6449177a69a0eb6adf8687cbc6285b2a6c24c4cb'
def tkmAarDir = file("${tkmWebrtcRepo}/io/github/webrtc-sdk/android/${tkmWebrtcVersion}")
def tkmAar = new File(tkmAarDir, "android-${tkmWebrtcVersion}.aar")
if (!tkmAar.exists() && !Boolean.parseBoolean("${project.findProperty('tkmWebrtcAarOffline') ?: 'false'}")) {
    tkmAarDir.mkdirs()
    def part = new File(tkmAarDir, "android-${tkmWebrtcVersion}.aar.part")
    logger.lifecycle("C182: fork AAR ${tkmWebrtcVersion} not in ${tkmWebrtcRepo} - fetching ${tkmWebrtcAarUrl}")
    try {
        new URL(tkmWebrtcAarUrl).withInputStream { i -> part.withOutputStream { o -> o << i } }
    } catch (Exception e) {
        part.delete()
        throw new GradleException("C182: could not fetch the fork AAR (${e.message}); put it in ${tkmWebrtcRepo} with tool/install_tkm_aar.sh or pass -PtkmWebrtcAarOffline=true", e)
    }
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    part.eachByte(1 << 16) { buf, n -> digest.update(buf, 0, n) }
    def got = digest.digest().encodeHex().toString()
    if (got != tkmWebrtcAarSha256) {
        part.delete()
        throw new GradleException("C182: fork AAR sha256 mismatch (got ${got}, pinned ${tkmWebrtcAarSha256}) - refusing it")
    }
    if (!part.renameTo(tkmAar)) throw new GradleException("C182: could not place ${tkmAar}")
    new File(tkmAarDir, "android-${tkmWebrtcVersion}.pom").text = """<?xml version="1.0" encoding="UTF-8"?>
<project xmlns="http://maven.apache.org/POM/4.0.0">
  <modelVersion>4.0.0</modelVersion>
  <groupId>io.github.webrtc-sdk</groupId>
  <artifactId>android</artifactId>
  <version>${tkmWebrtcVersion}</version>
  <packaging>aar</packaging>
</project>
"""
    logger.lifecycle("C182: fork AAR verified (sha256 ${got.take(12)}...) -> ${tkmAar}")
}

rootProject.allprojects {
    repositories {
        maven { url tkmWebrtcRepo }
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

apply plugin: 'com.android.library'

// AGP 9's built-in Kotlin compiles Kotlin itself and rejects the Kotlin Gradle
// Plugin. Apply KGP only when built-in Kotlin is NOT active: that means AGP < 9,
// or AGP 9 with android.builtInKotlin=false (the configuration Flutter currently
// ships by default while the ecosystem migrates).
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlinActive = agpMajor >= 9 &&
    (!project.hasProperty('android.builtInKotlin') ||
        Boolean.parseBoolean(project.property('android.builtInKotlin').toString()))
if (!builtInKotlinActive) {
    apply plugin: 'kotlin-android'
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.cloudwebrtc.webrtc'
    }
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 21
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'proguard-rules.pro'
    }

    lintOptions {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Configure the Kotlin JVM target. The compilerOptions DSL requires KGP 1.9+ or
// AGP 9 built-in Kotlin; older Flutter app templates ship KGP 1.8.x, which only
// supports the legacy kotlinOptions DSL.
def kotlinExt = project.extensions.findByName('kotlin')
if (kotlinExt?.hasProperty('compilerOptions')) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
        }
    }
} else {
    android.kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }
}

dependencies {
    // C182: our fork build (stock: io.github.webrtc-sdk:android:150.7871.01)
    implementation "io.github.webrtc-sdk:android:${tkmWebrtcVersion}"
    implementation 'com.github.davidliu:audioswitch:039a35aefab7747c557242fa216c9ea11743b604'
    implementation 'androidx.annotation:annotation:1.1.0'
    testImplementation 'junit:junit:4.13.2'
}
